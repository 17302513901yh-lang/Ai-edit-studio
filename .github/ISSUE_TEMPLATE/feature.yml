name: Feature request
description: An idea for a new tool, format or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to make, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: A new tool or option, an output size, a caption style, ... Examples are welcome.
    validations:
      required: true
  - type: dropdown
    id: help
    attributes:
      label: Would you like to build it?
      options:
        - "Yes, I'd like to open a pull request"
        - "Maybe, with some pointers"
        - "No, just the idea"
